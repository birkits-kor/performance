<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="theme-color" content="#111827">
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #111827;
      --accent-soft: #eef2f7;
      --danger: #b91c1c;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(17, 24, 39, .06);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 16px 2px 12px;
      background: linear-gradient(var(--bg) 78%, rgba(244,246,248,0));
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.25;
      letter-spacing: -.04em;
    }

    .updated {
      margin-top: 5px;
      font-size: 12px;
      color: var(--muted);
    }

    .refresh {
      border: 0;
      border-radius: 999px;
      padding: 10px 13px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      padding: 12px 14px;
      color: var(--text);
      outline: none;
    }

    .search:focus { border-color: #9ca3af; }

    .toggle {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 13px;
      background: var(--panel);
      cursor: pointer;
      white-space: nowrap;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 4px 0 14px;
    }

    .summary {
      min-height: 102px;
      padding: 15px;
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      word-break: keep-all;
    }

    .summary-value {
      margin-top: 8px;
      font-size: 21px;
      font-weight: 750;
      letter-spacing: -.035em;
      overflow-wrap: anywhere;
    }

    .cards {
      display: grid;
      gap: 10px;
    }

    .data-card {
      padding: 15px;
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .card-title {
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.4;
      letter-spacing: -.02em;
    }

    .kv {
      display: grid;
      grid-template-columns: minmax(90px, 42%) minmax(0, 1fr);
      gap: 7px 12px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
      align-items: start;
    }

    .kv:first-of-type { border-top: 0; padding-top: 0; }
    .key { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .value { text-align: right; font-weight: 650; font-size: 14px; overflow-wrap: anywhere; }

    .grid-wrap {
      display: none;
      overflow: auto;
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      min-width: 100%;
      font-size: 13px;
      white-space: nowrap;
    }

    th, td {
      padding: 11px 12px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: left;
      max-width: 360px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--accent-soft);
      font-weight: 750;
    }

    tr:last-child td { border-bottom: 0; }
    th:last-child, td:last-child { border-right: 0; }

    .empty, .error, .loading {
      padding: 36px 20px;
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      text-align: center;
      color: var(--muted);
    }

    .error { color: var(--danger); }

    .skeleton {
      height: 98px;
      margin-bottom: 10px;
      border-radius: var(--radius);
      background: linear-gradient(90deg, #eceff2 25%, #f7f8f9 50%, #eceff2 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      to { background-position: -200% 0; }
    }

    .bottom-nav {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 980px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.94);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .nav-btn {
      border: 0;
      border-radius: 14px;
      padding: 11px 5px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: #fff;
      background: var(--accent);
      font-weight: 700;
    }

    @media (min-width: 700px) {
      .app { padding-left: 22px; padding-right: 22px; }
      .summary-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .bottom-nav { border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-row">
        <div>
          <h1 id="appTitle">버킷츠 경영현황</h1>
          <div class="updated" id="updatedAt">데이터 불러오는 중</div>
        </div>
        <button class="refresh" id="refreshBtn" type="button">새로고침</button>
      </div>
      <div class="toolbar">
        <input class="search" id="searchInput" type="search" placeholder="현재 탭에서 검색">
        <button class="toggle" id="viewToggle" type="button">표 보기</button>
      </div>
    </header>

    <section id="content">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>
  </main>

  <nav class="bottom-nav" id="bottomNav" aria-label="대시보드 탭"></nav>

  <script>
    const SHEET_NAMES = ['월손익', '광고성과', '점포별현황'];
    const state = {
      data: null,
      activeSheet: SHEET_NAMES[0],
      query: '',
      view: 'cards'
    };

    const appTitle = document.getElementById('appTitle');
    const updatedAt = document.getElementById('updatedAt');
    const content = document.getElementById('content');
    const bottomNav = document.getElementById('bottomNav');
    const searchInput = document.getElementById('searchInput');
    const viewToggle = document.getElementById('viewToggle');
    const refreshBtn = document.getElementById('refreshBtn');

    function loadData() {
      setLoading(true);
      google.script.run
        .withSuccessHandler(function(payload) {
          state.data = payload;
          appTitle.textContent = payload.title || '경영현황';
          updatedAt.textContent = '기준 ' + (payload.updatedAt || '-');
          renderNav();
          render();
          setLoading(false);
        })
        .withFailureHandler(function(error) {
          content.innerHTML = '<div class="error">데이터를 불러오지 못했습니다.<br>' +
            escapeHtml(error && error.message ? error.message : String(error)) + '</div>';
          updatedAt.textContent = '오류 발생';
          setLoading(false);
        })
        .getDashboardData();
    }

    function setLoading(isLoading) {
      refreshBtn.disabled = isLoading;
      refreshBtn.textContent = isLoading ? '불러오는 중' : '새로고침';
      if (isLoading && !state.data) {
        content.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
      }
    }

    function renderNav() {
      bottomNav.innerHTML = SHEET_NAMES.map(function(name) {
        return '<button class="nav-btn ' + (state.activeSheet === name ? 'active' : '') +
          '" type="button" data-sheet="' + escapeHtml(name) + '">' + escapeHtml(name) + '</button>';
      }).join('');
    }

    function render() {
      if (!state.data) return;

      const sheet = state.data.sheets[state.activeSheet];
      if (!sheet) {
        content.innerHTML = '<div class="error">탭 데이터를 찾을 수 없습니다.</div>';
        return;
      }
      if (sheet.error) {
        content.innerHTML = '<div class="error">' + escapeHtml(sheet.error) + '</div>';
        return;
      }
      if (!sheet.values || !sheet.values.length) {
        content.innerHTML = '<div class="empty">표시할 데이터가 없습니다.</div>';
        return;
      }

      const model = buildModel(sheet.values, sheet.headerRow);
      const filteredRows = filterRows(model.rows, state.query);

      const summaryHtml = state.view === 'cards'
        ? renderSummary(extractSummary(sheet.values, model.headerRow))
        : '';

      const bodyHtml = state.view === 'cards'
        ? renderCards(model.headers, filteredRows)
        : renderTable(model.headers, filteredRows);

      content.innerHTML = summaryHtml + bodyHtml;
      viewToggle.textContent = state.view === 'cards' ? '표 보기' : '카드 보기';
    }

    function buildModel(values, detectedHeaderRow) {
      const width = Math.max.apply(null, values.map(function(row) { return row.length; }));
      let headerRow = Number.isInteger(detectedHeaderRow) ? detectedHeaderRow : -1;

      if (headerRow < 0 || headerRow >= values.length) {
        headerRow = 0;
      }

      let headers = Array.from({ length: width }, function(_, index) {
        const label = String((values[headerRow] || [])[index] || '').trim();
        return label || ('항목 ' + (index + 1));
      });

      let rows = values.slice(headerRow + 1).filter(function(row) {
        return row.some(function(value) { return String(value).trim() !== ''; });
      });

      if (!rows.length && values.length) {
        headers = Array.from({ length: width }, function(_, index) {
          return index === 0 ? '항목' : ('값 ' + index);
        });
        rows = values;
      }

      return { headers: headers, rows: rows, headerRow: headerRow };
    }

    function extractSummary(values, headerRow) {
      const result = [];
      const seen = new Set();
      const scanRows = values.slice(0, Math.min(values.length, Math.max(headerRow + 1, 14)));

      scanRows.forEach(function(row) {
        const cells = row.map(function(value) { return String(value).trim(); });
        const nonEmpty = cells.map(function(value, index) {
          return { value: value, index: index };
        }).filter(function(item) { return item.value !== ''; });

        if (nonEmpty.length === 2 && looksLikeValue(nonEmpty[1].value) && !looksLikeValue(nonEmpty[0].value)) {
          pushMetric(nonEmpty[0].value, nonEmpty[1].value);
        }

        for (let i = 0; i + 1 < cells.length; i += 2) {
          if (cells[i] && cells[i + 1] && !looksLikeValue(cells[i]) && looksLikeValue(cells[i + 1])) {
            pushMetric(cells[i], cells[i + 1]);
          }
        }
      });

      function pushMetric(label, value) {
        const key = label + '|' + value;
        if (seen.has(key) || result.length >= 6) return;
        seen.add(key);
        result.push({ label: label, value: value });
      }

      return result;
    }

    function renderSummary(metrics) {
      if (!metrics.length) return '';
      return '<div class="summary-grid">' + metrics.map(function(metric) {
        return '<article class="summary">' +
          '<div class="summary-label">' + highlight(metric.label, state.query) + '</div>' +
          '<div class="summary-value">' + highlight(metric.value, state.query) + '</div>' +
          '</article>';
      }).join('') + '</div>';
    }

    function renderCards(headers, rows) {
      if (!rows.length) return '<div class="empty">검색 결과가 없습니다.</div>';

      return '<div class="cards">' + rows.map(function(row, rowIndex) {
        const firstUseful = row.find(function(value) { return String(value).trim() !== ''; });
        const title = firstUseful ? String(firstUseful) : ('항목 ' + (rowIndex + 1));

        const pairs = headers.map(function(header, index) {
          const value = String(row[index] == null ? '' : row[index]).trim();
          if (!value) return '';
          return '<div class="kv">' +
            '<div class="key">' + highlight(header, state.query) + '</div>' +
            '<div class="value">' + highlight(value, state.query) + '</div>' +
            '</div>';
        }).join('');

        return '<article class="data-card">' +
          '<h2 class="card-title">' + highlight(title, state.query) + '</h2>' +
          pairs +
          '</article>';
      }).join('') + '</div>';
    }

    function renderTable(headers, rows) {
      if (!rows.length) return '<div class="empty">검색 결과가 없습니다.</div>';

      const head = '<thead><tr>' + headers.map(function(header) {
        return '<th>' + highlight(header, state.query) + '</th>';
      }).join('') + '</tr></thead>';

      const body = '<tbody>' + rows.map(function(row) {
        return '<tr>' + headers.map(function(_, index) {
          return '<td title="' + escapeAttr(String(row[index] == null ? '' : row[index])) + '">' +
            highlight(String(row[index] == null ? '' : row[index]), state.query) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody>';

      return '<div class="grid-wrap" style="display:block"><table>' + head + body + '</table></div>';
    }

    function filterRows(rows, query) {
      const q = String(query || '').trim().toLowerCase();
      if (!q) return rows;
      return rows.filter(function(row) {
        return row.some(function(value) {
          return String(value).toLowerCase().includes(q);
        });
      });
    }

    function looksLikeValue(value) {
      const v = String(value).replace(/\s/g, '');
      return /^[-+]?[\d,.]+(%|원|만원|억원|개|건|명|회)?$/.test(v)
        || /^\d{4}[-./]\d{1,2}([-.\/]\d{1,2})?$/.test(v);
    }

    function highlight(value, query) {
      const text = String(value == null ? '' : value);
      const q = String(query || '').trim();
      if (!q) return escapeHtml(text);

      const lower = text.toLowerCase();
      const needle = q.toLowerCase();
      let cursor = 0;
      let result = '';
      let index;

      while ((index = lower.indexOf(needle, cursor)) !== -1) {
        result += escapeHtml(text.slice(cursor, index));
        result += '<mark>' + escapeHtml(text.slice(index, index + q.length)) + '</mark>';
        cursor = index + q.length;
      }
      result += escapeHtml(text.slice(cursor));
      return result;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/\n/g, ' ');
    }

    bottomNav.addEventListener('click', function(event) {
      const button = event.target.closest('[data-sheet]');
      if (!button) return;
      state.activeSheet = button.dataset.sheet;
      state.query = '';
      searchInput.value = '';
      renderNav();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    searchInput.addEventListener('input', function(event) {
      state.query = event.target.value;
      render();
    });

    viewToggle.addEventListener('click', function() {
      state.view = state.view === 'cards' ? 'table' : 'cards';
      render();
    });

    refreshBtn.addEventListener('click', loadData);

    loadData();
  </script>
</body>
</html>
