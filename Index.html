<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shimon Living 통합 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    .accordion-content { transition: max-height 0.3s ease-out; overflow: hidden; max-height: 0; }
    .accordion-content.open { max-height: 1000px; }
    /* Hide scrollbar for clean mobile view */
    ::-webkit-scrollbar { width: 0px; background: transparent; }
  </style>
</head>
<body class="text-gray-800 font-sans pb-20">
  
  <!-- 상단 헤더 -->
  <header class="bg-white shadow-sm sticky top-0 z-40 px-4 py-4 mb-4">
    <h1 class="text-xl font-bold text-gray-900 text-center">📊 통합 비즈니스 대시보드</h1>
  </header>

  <div class="max-w-md mx-auto px-4">
    <!-- 로딩 스피너 -->
    <div id="loading" class="text-center py-12">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mx-auto mb-4"></div>
      <p class="text-gray-500 font-medium">데이터를 동기화 중입니다...</p>
    </div>
    
    <!-- 첫 번째 탭: 월 손익계산 -->
    <div id="tab-profit" class="hidden animate-fade-in space-y-5">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-lg font-bold text-gray-800">최신 손익 요약</h2>
        <span id="latest-month" class="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-1 rounded"></span>
      </div>

      <div class="bg-white rounded-2xl shadow-sm p-5 border border-gray-100">
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-blue-50 p-3 rounded-xl">
            <p class="text-xs text-blue-600 font-bold mb-1">예상손익</p>
            <p class="text-lg font-black text-gray-900 truncate" id="latest-profit"></p>
          </div>
          <div class="bg-green-50 p-3 rounded-xl">
            <p class="text-xs text-green-600 font-bold mb-1">총 매출</p>
            <p class="text-lg font-black text-gray-900 truncate" id="latest-revenue"></p>
          </div>
          <div class="p-3 rounded-xl border border-gray-100">
            <p class="text-xs text-gray-500 font-bold mb-1">온라인 매출</p>
            <p class="text-sm font-bold text-gray-800 truncate" id="latest-online"></p>
          </div>
          <div class="p-3 rounded-xl border border-gray-100">
            <p class="text-xs text-gray-500 font-bold mb-1">오프라인 매출</p>
            <p class="text-sm font-bold text-gray-800 truncate" id="latest-offline"></p>
          </div>
        </div>
        <div class="mt-4 pt-3 border-t border-gray-100 flex justify-between text-xs">
          <div><span class="text-gray-400">판매세트</span> <span id="latest-sets" class="font-bold text-gray-700 ml-1"></span></div>
          <div><span class="text-gray-400">광고비/매출</span> <span id="latest-ads-ratio" class="font-bold text-gray-700 ml-1"></span></div>
        </div>
      </div>

      <h2 class="text-lg font-bold text-gray-800 mt-6 mb-2">과거 내역</h2>
      <div id="history-container" class="space-y-3"></div>
    </div>

    <!-- 두 번째 탭: 점포별 현황 -->
    <div id="tab-store" class="hidden animate-fade-in space-y-4">
      <h2 class="text-lg font-bold text-gray-800 mb-2">점포별 현황 요약</h2>
      <div id="store-container" class="space-y-3">
        <!-- JS 동적 생성 영역 -->
      </div>
    </div>
  </div>

  <!-- 모바일 하단 네비게이션 탭 -->
  <nav class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 flex justify-around p-3 pb-5 z-50">
    <button onclick="switchTab('profit')" id="btn-profit" class="flex flex-col items-center flex-1 text-blue-600 transition-colors">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
      <span class="text-[10px] font-bold">월 손익계산</span>
    </button>
    <button onclick="switchTab('store')" id="btn-store" class="flex flex-col items-center flex-1 text-gray-400 transition-colors">
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
      <span class="text-[10px] font-bold">점포별 현황</span>
    </button>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      google.script.run.withSuccessHandler(renderData).withFailureHandler(showError).getDashboardData();
    });

    function switchTab(tabId) {
      document.getElementById('tab-profit').classList.add('hidden');
      document.getElementById('tab-store').classList.add('hidden');
      
      document.getElementById('btn-profit').classList.replace('text-blue-600', 'text-gray-400');
      document.getElementById('btn-store').classList.replace('text-blue-600', 'text-gray-400');
      
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      document.getElementById('btn-' + tabId).classList.replace('text-gray-400', 'text-blue-600');
      
      window.scrollTo(0, 0);
    }

    function showError(err) {
      document.getElementById('loading').innerHTML = `<p class="text-red-500 font-bold p-4">데이터 연동 실패<br><span class="text-xs text-gray-500">${err}</span></p>`;
    }

    const formatCurrency = (val) => {
      if (!val) return '0';
      let numStr = String(val).replace(/[^0-9.-]+/g, '');
      let num = parseFloat(numStr);
      return isNaN(num) ? val : '₩' + num.toLocaleString('ko-KR');
    };

    function renderData(data) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('tab-profit').classList.remove('hidden'); // Default tab

      // --- Tab 1: 월 손익계산 렌더링 ---
      if (data.profitData && data.profitData.latest) {
        const pd = data.profitData;
        const getVal = (obj, key) => obj[key] || '-';

        document.getElementById('latest-month').textContent = getVal(pd.latest, '기간');
        
        const profit = getVal(pd.latest, '예상손익');
        const profitEl = document.getElementById('latest-profit');
        profitEl.textContent = formatCurrency(profit);
        if (String(profit).includes('-')) profitEl.classList.replace('text-gray-900', 'text-red-500');

        document.getElementById('latest-revenue').textContent = formatCurrency(getVal(pd.latest, '매출'));
        document.getElementById('latest-online').textContent = formatCurrency(getVal(pd.latest, '온'));
        document.getElementById('latest-offline').textContent = formatCurrency(getVal(pd.latest, '오프'));
        document.getElementById('latest-sets').textContent = getVal(pd.latest, '판매세트');
        document.getElementById('latest-ads-ratio').textContent = getVal(pd.latest, '광고비/매출');

        const container = document.getElementById('history-container');
        pd.history.forEach((row, index) => {
          const isMinus = String(row['예상손익']).includes('-');
          const card = document.createElement('div');
          card.className = 'bg-white border border-gray-100 rounded-xl shadow-sm';
          
          card.innerHTML = `
            <button class="w-full px-4 py-3 flex justify-between items-center focus:outline-none" onclick="toggleAccordion('content-${index}', 'icon-${index}')">
              <span class="font-bold text-sm text-gray-800 w-1/3 text-left">${row['기간']}</span>
              <span class="text-xs text-gray-500 w-1/3 text-center truncate">${formatCurrency(row['매출'])}</span>
              <div class="flex items-center justify-end space-x-2 w-1/3">
                <span class="${isMinus ? 'text-red-500' : 'text-blue-600'} font-bold text-xs truncate">${formatCurrency(row['예상손익'])}</span>
                <svg id="icon-${index}" class="w-4 h-4 text-gray-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </button>
            <div id="content-${index}" class="accordion-content bg-gray-50 rounded-b-xl border-t border-gray-100">
              <div class="p-4 grid grid-cols-2 gap-3 text-xs">
                <div><span class="text-gray-400 block mb-1">온라인</span><span class="font-bold text-gray-700">${formatCurrency(row['온'])}</span></div>
                <div><span class="text-gray-400 block mb-1">오프라인</span><span class="font-bold text-gray-700">${formatCurrency(row['오프'])}</span></div>
                <div><span class="text-gray-400 block mb-1">판매세트</span><span class="font-bold text-gray-700">${row['판매세트']}</span></div>
                <div><span class="text-gray-400 block mb-1">광고비중</span><span class="font-bold text-gray-700">${row['광고비/매출']}</span></div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } else {
        document.getElementById('tab-profit').innerHTML = '<p class="text-center text-gray-500 py-10">월 손익계산 데이터가 없습니다.</p>';
      }

      // --- Tab 2: 점포별 현황 렌더링 ---
      const storeTab = document.getElementById('store-container');
      if (data.storeData && data.storeData.rows.length > 0) {
        let html = '';
        data.storeData.rows.forEach(row => {
          html += '<div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">';
          let isFirst = true;
          html += '<div class="grid grid-cols-2 gap-y-3 gap-x-2 text-xs">';
          
          for (let key in row) {
            const val = row[key];
            if (isFirst) {
              html += `<div class="col-span-2 text-sm font-bold text-gray-800 border-b border-gray-100 pb-2 mb-1">${val}</div>`;
              isFirst = false;
            } else {
              let displayVal = val;
              if (/[0-9]/.test(displayVal) && displayVal.length > 3) {
                 const testNum = String(displayVal).replace(/[^0-9.-]+/g, '');
                 if(!isNaN(parseFloat(testNum))) displayVal = displayVal.includes('%') ? displayVal : formatCurrency(val);
              }
              html += `<div class="flex flex-col"><span class="text-gray-400 mb-1 line-clamp-1">${key}</span><span class="font-semibold text-gray-700 line-clamp-1">${displayVal}</span></div>`;
            }
          }
          html += '</div></div>';
        });
        storeTab.innerHTML = html;
      } else {
        storeTab.innerHTML = '<div class="bg-white p-6 rounded-xl shadow-sm text-center"><p class="text-gray-500 text-sm">점포별 현황 데이터가 비어있거나 읽을 수 없습니다.</p></div>';
      }
    }

    function toggleAccordion(contentId, iconId) {
      const content = document.getElementById(contentId);
      const icon = document.getElementById(iconId);
      if (content.classList.contains('open')) {
        content.classList.remove('open');
        icon.classList.remove('rotate-180');
      } else {
        content.classList.add('open');
        icon.classList.add('rotate-180');
      }
    }
  </script>
</body>
</html>
