<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>월손익계산 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .accordion-content { transition: max-height 0.3s ease-out; overflow: hidden; max-height: 0; }
    .accordion-content.open { max-height: 1000px; }
    /* 구글 앱스 스크립트 iframe 로드 방지용 배경 통일 */
    body { background-color: #f9fafb; }
  </style>
</head>
<body class="text-gray-800 p-4 md:p-8 font-sans">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-8 text-center">📊 월손익계산 핵심 대시보드</h1>
    
    <div id="loading" class="text-center py-10">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mx-auto mb-4"></div>
      <p class="text-gray-500">데이터를 불러오는 중입니다...</p>
    </div>
    
    <div id="dashboard" class="hidden">
      <!-- 최신 성과 메인 카드 -->
      <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center">
        <span class="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full mr-2 shadow-sm">최신 성과</span>
        <span id="latest-month"></span>
      </h2>
      <div class="bg-white rounded-2xl shadow-lg p-6 mb-8 border-t-4 border-blue-600">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
          <div class="bg-blue-50 p-4 rounded-xl">
            <p class="text-xs md:text-sm text-blue-600 font-bold mb-1">예상손익</p>
            <p class="text-xl md:text-2xl font-black text-gray-900" id="latest-profit"></p>
          </div>
          <div class="bg-green-50 p-4 rounded-xl">
            <p class="text-xs md:text-sm text-green-600 font-bold mb-1">총 매출</p>
            <p class="text-xl md:text-2xl font-black text-gray-900" id="latest-revenue"></p>
          </div>
          <div class="p-4 rounded-xl border border-gray-100">
            <p class="text-xs text-gray-500 font-bold mb-1">온라인 매출</p>
            <p class="text-lg md:text-xl font-bold text-gray-800" id="latest-online"></p>
          </div>
          <div class="p-4 rounded-xl border border-gray-100">
            <p class="text-xs text-gray-500 font-bold mb-1">오프라인 매출</p>
            <p class="text-lg md:text-xl font-bold text-gray-800" id="latest-offline"></p>
          </div>
        </div>
        <div class="mt-6 pt-4 border-t border-gray-100 flex flex-wrap justify-between items-center text-sm md:text-base text-gray-600">
          <div class="mb-2 md:mb-0"><span class="font-bold mr-2 text-gray-400">판매세트</span> <span id="latest-sets" class="text-gray-900 font-semibold bg-gray-100 px-2 py-1 rounded"></span></div>
          <div><span class="font-bold mr-2 text-gray-400">광고비/매출</span> <span id="latest-ads-ratio" class="text-gray-900 font-semibold bg-gray-100 px-2 py-1 rounded"></span></div>
        </div>
      </div>

      <!-- 이전 성과 내역 (아코디언) -->
      <h2 class="text-xl font-bold text-gray-700 mb-4">이전 성과 내역</h2>
      <div id="history-container" class="space-y-3">
        <!-- JS 동적 생성 영역 -->
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      google.script.run.withSuccessHandler(renderData).withFailureHandler(showError).getDashboardData();
    });

    function showError(err) {
      document.getElementById('loading').innerHTML = `<p class="text-red-500 font-bold">데이터를 불러오지 못했습니다.<br><span class="text-sm text-gray-500">${err}</span></p>`;
    }

    function renderData(data) {
      const loadEl = document.getElementById('loading');
      const dashEl = document.getElementById('dashboard');
      
      if (!data || !data.latest) {
        loadEl.innerHTML = '<p class="text-center text-red-500">표시할 유효한 데이터가 없습니다.</p>';
        return;
      }
      
      loadEl.classList.add('hidden');
      dashEl.classList.remove('hidden');

      const formatCurrency = (val) => {
        if (!val) return '0';
        let numStr = String(val).replace(/[^0-9.-]+/g, '');
        let num = parseFloat(numStr);
        return isNaN(num) ? val : '₩' + num.toLocaleString('ko-KR');
      };
      
      const getVal = (obj, key) => obj[key] || '-';

      // 최신 성과 바인딩
      document.getElementById('latest-month').textContent = getVal(data.latest, '기간');
      
      const profit = getVal(data.latest, '예상손익');
      const profitEl = document.getElementById('latest-profit');
      profitEl.textContent = formatCurrency(profit);
      if(String(profit).includes('-')) profitEl.classList.add('text-red-600');

      document.getElementById('latest-revenue').textContent = formatCurrency(getVal(data.latest, '매출'));
      document.getElementById('latest-online').textContent = formatCurrency(getVal(data.latest, '온'));
      document.getElementById('latest-offline').textContent = formatCurrency(getVal(data.latest, '오프'));
      document.getElementById('latest-sets').textContent = getVal(data.latest, '판매세트') + ' 세트';
      document.getElementById('latest-ads-ratio').textContent = getVal(data.latest, '광고비/매출');

      // 이전 성과 바인딩 (아코디언)
      const container = document.getElementById('history-container');
      data.history.forEach((row, index) => {
        const period = getVal(row, '기간');
        const profitVal = getVal(row, '예상손익');
        const profitFmt = formatCurrency(profitVal);
        const revenue = formatCurrency(getVal(row, '매출'));
        const isMinus = String(profitVal).includes('-');
        
        const card = document.createElement('div');
        card.className = 'bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm';
        
        card.innerHTML = `
          <button class="w-full text-left px-5 py-4 flex justify-between items-center hover:bg-gray-50 focus:outline-none transition-colors" onclick="toggleAccordion('content-${index}', 'icon-${index}')">
            <div class="flex items-center space-x-3 md:space-x-6">
              <span class="font-bold text-gray-800 w-16 md:w-20">${period}</span>
              <span class="text-sm text-gray-500 hidden sm:inline border-l pl-4">매출: ${revenue}</span>
            </div>
            <div class="flex items-center space-x-4">
              <span class="${isMinus ? 'text-red-500' : 'text-blue-600'} font-bold text-sm md:text-base">손익: ${profitFmt}</span>
              <svg id="icon-${index}" class="w-5 h-5 text-gray-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
          </button>
          <div id="content-${index}" class="accordion-content bg-gray-50 border-t border-gray-100">
            <div class="p-5 grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs md:text-sm">
              <div><span class="text-gray-400 block mb-1 font-semibold">온라인 매출</span><span class="font-bold text-gray-700">${formatCurrency(getVal(row, '온'))}</span></div>
              <div><span class="text-gray-400 block mb-1 font-semibold">오프라인 매출</span><span class="font-bold text-gray-700">${formatCurrency(getVal(row, '오프'))}</span></div>
              <div><span class="text-gray-400 block mb-1 font-semibold">판매세트</span><span class="font-bold text-gray-700">${getVal(row, '판매세트')}</span></div>
              <div><span class="text-gray-400 block mb-1 font-semibold">광고비/매출</span><span class="font-bold text-gray-700">${getVal(row, '광고비/매출')}</span></div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleAccordion(contentId, iconId) {
      const content = document.getElementById(contentId);
      const icon = document.getElementById(iconId);
      if (content.classList.contains('open')) {
        content.classList.remove('open');
        icon.classList.remove('rotate-180');
      } else {
        content.classList.add('open');
        icon.classList.add('rotate-180');
      }
    }
  </script>
</body>
</html>
